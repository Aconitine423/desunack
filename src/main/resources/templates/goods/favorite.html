<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/img/favicon/favicon-16x16.png" type="image/x-icon">
    <title th:text="${session.userName}+'님의 찜목록'">찜한 상품</title>
    
    <!-- 공통 CSS -->
    <link rel="stylesheet" href="/common/reset.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    
    <!-- 페이지 전용 -->
    <link rel="stylesheet" href="/css/shoppingCart.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="dsnk" data-user-role="member" data-user-uid="700001">
    <!-- 공통 헤더/사이드바 인클루드 -->
    <th:block th:replace="~{fragments/fragments :: header}"></th:block>
    
    <div class="mypage-layout">
        <div id="site-side" data-include="/common/sidebar.html"></div>
        
        <main class="container wishlist-page" role="main" aria-labelledby="pageTitle">
            <h1 id="pageTitle" class="page-title" th:text="${session.userName}+'님의 찜목록'">찜 목록</h1>
            <div class="wishlist-table-wrap">

                <table class="wishlist-table">
                    <colgroup>
                        <col style="width:90px">
                        <col style="width:400px">
                        <col style="width:100px">
                        <col style="width:120px">
                    </colgroup>
                    <thead>
                        <tr>
                            <th scope="col" colspan="2">상품정보</th>
                            <th scope="col">가격</th>
                            <th scope="col">삭제하기</th>
                        </tr>
                    </thead>
                    <tbody id="wishTbody"></tbody>
                </table>
            </div>
        </main>
    </div>
    
    <!-- 푸터 -->
    <th:block th:replace="~{fragments/fragments :: footer}"></th:block>
    
<!--    <script src="/js/sidebar.js"></script>-->
<!--    <script src="/js/common.js"></script>-->
    <script src="/js/shoppingCart.js"></script>
<script th:inline="javascript">
    let favoriteList = [[${fList}]];


    const createHtml = (favoriteList) => {
        let html = "";
        for (const fv of favoriteList) {
            let substr = fv.replaceAll(' ', '')
            substr = substr.replaceAll('"', '');
            console.log(substr);
            let startname = substr.indexOf('g_name') + 7;
            let endname = substr.indexOf('g_image') - 1;
            let name = substr.substring(startname, endname);
            let startimage = substr.indexOf('g_image') + 8;
            let endimage = substr.indexOf('g_value') - 1;
            let imageUrl = substr.substring(startimage, endimage);
            console.log(name, imageUrl);
            let startgid = substr.indexOf('g_id') + 5;
            let endgid = substr.indexOf('g_name') -1;
            let g_id = substr.substring(startgid, endgid);
            let startbrand = substr.indexOf('brand_name') + 11;
            let endbrand = substr.indexOf('}');
            let brandName = substr.substring(startbrand, endbrand);
            let startPrice = substr.indexOf('g_value')+8;
            let endPrice = substr.indexOf('brand_name') -1;
            let price = substr.substring(startPrice, endPrice);
            html += `<tr><td><div class="prod" tabindex="0">
                     <a href="/goods/detail/${g_id}"><img class="prod-img" src="${imageUrl}" alt="${name}"><a>
</div></td><td><a href="/goods/detail/${g_id}"><div class="prod-info">
<div class="prod-brand">${brandName}</div>
<div class="prod-name">${name}</div>
</div></a></td>
 <td>${price}원</td><td>
 <button type="button" class="btn btn-danger btn-del" data-id="${g_id}">삭제</button>
                 </td><tr>`;
            console.log(html);

        }
        return html;
    }

    $(document).ready(function () {
        const favorite = $('#wishTbody');
        favorite.empty();
        try{
            const html = createHtml(favoriteList);
            favorite.html(html);
            $('.btn-del').click(function () {
                const favoriteDto = {
                    f_g_id: $(this).data('id'),
                }
                axios.post('/goods/favorite/delete', favoriteDto).then(function(response){
                    console.log("삭제 성공");
                    location.reload();
                }).catch(function(error){
                    console.log("삭제 실패");
                })
            })
        }catch(e){
            console.log(e);
            favorite.html('<tr><td colspan="4">데이터를 불러오는 데 실패했습니다.</td></tr>');
        }
    })

</script>
</body>
</html>
