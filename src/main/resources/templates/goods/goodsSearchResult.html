<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>검색결과</title>
    <link rel="shortcut icon" href="/img/favicon/favicon-16x16.png" type="image/x-icon">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/common/reset.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .title {
            font-size: 2.25rem;
            font-weight: bold;
            color: #1f2937;
            text-align: center;
            margin-bottom: 24px;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 24px;
        }
        .goods-card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            background-color: #ffffff;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .goods-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }
        .goods-image {
            width: 100%;
            height: 192px;
            background-color: #e5e7eb;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .goods-image span {
            color: #6b7280;
        }
        .goods-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        .goods-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: #ef4444;
            margin-bottom: 8px;
        }
        .goods-description {
            color: #6b7280;
            font-size: 0.875rem;
        }
        .no-results-message {
            text-align: center;
            color: #6b7280;
            margin-top: 40px;
            display: none;
        }
        .no-results-message p {
            font-size: 1.25rem;
        }
    </style>
</head>
<body>
<th:block th:replace="~{fragments/fragments :: header}"></th:block>
<section>
    <div class="container">
        <h1 class="title">상품 검색 결과</h1>

        <div id="results-container" class="results-grid"></div>

        <div id="no-results-message" class="no-results-message" style="display: none;">
            <p>검색 결과가 없습니다. 다른 검색 조건을 시도해 보세요.</p>
        </div>
    </div>
</section>
<th:block th:replace="~{fragments/fragments :: footer}"></th:block>
</body>
<script th:inline="javascript">
    $(document).ready(function() {
        // 💡 페이지 로드 시 세션 스토리지에서 데이터 불러오기
        const searchResultsString = sessionStorage.getItem('searchResults');
        const resultsContainer = $('#results-container');
        const noResultsMessage = $('#no-results-message');

        if (searchResultsString) {
            const searchResults = JSON.parse(searchResultsString);

            if (searchResults.length > 0) {
                // 결과가 있을 경우, HTML을 동적으로 생성
                noResultsMessage.hide();
                resultsContainer.show();

                searchResults.forEach(goods => {
                    // 금액을 쉼표로 포맷팅
                    const formattedPrice = new Intl.NumberFormat('ko-KR').format(goods.g_value);
                    // 평점 계산 및 소수점 첫째 자리까지 표시
                    let ratingText;
                    if (goods.g_review_count === 0) {
                        // 리뷰 수가 0일 경우, "별점 없음"으로 표시
                        ratingText = "별점 없음";
                    } else {
                        // 리뷰 수가 있을 경우, 평점 계산 후 소수점 첫째 자리까지 표시
                        const rating = (goods.g_total_rating / goods.g_review_count).toFixed(1);
                        ratingText = `★${rating}`;
                    }

                    const goodsCard = `
                            <div class="goods-card">
                                <div class="goods-image">
                                    <span><a href="/goods/detail/${goods.g_id}"><img src="${goods.g_image}" alt="${goods.g_name}"></a></span>
                                </div>
                                <h4 class="goods-name">${goods.g_name}</h4>
                                <p class="goods-price">${formattedPrice}원</p>
                                <p class="goods-description">${ratingText}</p>
                            </div>
                        `;
                    resultsContainer.append(goodsCard);
                });
            } else {
                // 결과는 있지만 내용이 없을 경우
                resultsContainer.hide();
                noResultsMessage.show();
            }

            // 💡 사용 후 데이터 삭제 (새로운 검색 시 혼란 방지)
            sessionStorage.removeItem('searchResults');

        } else {
            // 세션 스토리지에 데이터가 없을 경우
            resultsContainer.hide();
            noResultsMessage.show();
        }
    });
</script>
</html>
