<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>소비자정보수정</title>
    <link rel="shortcut icon" href="/img/favicon/favicon-16x16.png" type="image/x-icon">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="/common/reset.css">
    <link rel="stylesheet" href="/css/mypage.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/customerUpdateFrm.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<th:block th:replace="~{fragments :: header}"></th:block>
<section class="mypage" data-role="consumer" data-user-uid="U123456">
    <!-- [상단 탭] : 프로필 / 주문내역 / 찜한 상품 -->
    <nav class="mypage-tabs" role="tablist" aria-label="마이페이지 탭">
        <!-- 프로필(프로필: fa-user) -->
        <button class="mypage-tab is-active" data-tab="profile" role="tab" aria-selected="true">
            <span class="i"><i class="fa-regular fa-user"></i></span>프로필
        </button>
        <!-- 주문내역(영수증: fa-receipt) -->
        <button class="mypage-tabs" data-tab="orders" role="tab" aria-selected="false">
            <span class="i"><i class="fa-solid fa-receipt"></i></span>주문내역
        </button>
        <!-- 찜한상품(하트: fa-heart) -->
        <button class="mypage-tabs" data-tab="wish" role="tab" aria-selected="false">
            <span class="i"><i class="fa-regular fa-heart"></i></span>찜한상품
        </button>
    </nav>

    <div class="mypage-grid">
        <!-- [L] 좌측 사이드 메뉴 -->
        <aside class="mypage-side" aria-label="마이페이지 메뉴">
            <!-- JS 렌더 대상 -->
            <div id="mypage-menu"></div>

            <!--소비자용 템플릿 -->
            <template id="tpl-menu-consumer">
                <section class="menu-section">
                    <p class="menu-title">주문 관리</p>
                    <ul class="menu-list">
                        <li><span class="i"><i class="fa-solid fa-receipt"></i>주문 내역</span></li>
                        <li><span class="i"><i class="fa-solid fa-truck-fast"></i>택배배송 조회</span></li>
                    </ul>
                </section>
                <section class="menu-section">
                    <p class="menu-title">혜택 관리</p>
                    <ul class="menu-list">
                        <li><span class="i"><i class="fa-solid fa-coins"></i>포인트 조회</span></li>
                        <li><span class="i"><i class="fa-solid fa-ticket"></i>쿠폰</span></li>
                        <li><span class="i"><i class="fa-regular fa-star"></i>관심 상품</span></li>
                        <li><span class="i"><i class="fa-regular fa-heart"></i>찜 목록</span></li>
                    </ul>
                </section>
                <section class="menu-section">
                    <p class="menu-title">회원 정보</p>
                    <ul class="menu-list">
                        <li><span class="i"><i class="fa-regular fa-id-card"></i>회원정보 수정</span></li>
                        <li><span class="i"><i class="fa-solid fa-person-walking-arrow-right"></i>회원 탈퇴</span></li>
                    </ul>
                </section>
            </template>
        </aside>

        <!-- [R] 우측 컨텐츠 -->
        <main class="mypage-main">
            <form th:action="@{/member/customerUpdate}" id="updateForm" class="updateForm" method="post">
                <!--  회원 uid (히든)  -->
                <input type="hidden" name="userUid" id="userUid" th:value="${cDto.userUid}">
                <!--  아이디 입력  -->
                <div class="inputGroup">
                    <label for="userId">아이디</label>
                    <div class="inputContainer">
                        <input type="text" class="inputForm" id="userId" name="userId" placeholder="아이디를 입력하세요"
                               autocomplete="off" th:value="${cDto.userId}" readonly>
<!--                        <input type="button" id="checkId" class="checkBtn" value="중복확인" onclick="checkUserId()"-->
<!--                               style="cursor: pointer">-->
                    </div>
                    <span id="idError" class="errorMsg"></span>
                </div>
                <!--  비밀번호 입력  -->
<!--                <div class="inputGroup">-->
<!--                    <label for="userPassword">비밀번호</label>-->
<!--                    <div class="inputContainer">-->
<!--                        <input type="password" class="inputForm" id="userPassword" name="userPassword"-->
<!--                               placeholder="회원정보수정을 하려면 비밀번호를 입력하세요.">-->
<!--                    </div>-->
<!--                    <span id="pwError" class="errorMsg"></span>-->
<!--                </div>-->
                <!--  이름 입력  -->
                <div class="inputGroup">
                    <label for="userName">이름</label>
                    <div class="inputContainer">
                        <input type="text" class="inputForm" id="userName" name="userName" placeholder="이름을 입력하세요."
                               autocomplete="off" th:value="${cDto.userName}">
                    </div>
                    <span id="nameError" class="errorMsg"></span>
                </div>
                <!--  닉네임 입력  -->
                <div class="inputGroup">
                    <label for="userNickname">닉네임</label>
                    <div class="inputContainer">
                        <input type="text" class="inputForm" id="userNickname" name="userNickname"
                               placeholder="닉네임을 입력하세요."
                               autocomplete="off" th:value="${cDto.customerNickname}">
                        <input type="hidden" id="originalNickname" th:value="${cDto.customerNickname}">
                        <input type="button" id="checkNickname" class="checkBtn" value="중복확인"
                               onclick="checkUserNickname()"
                               style="cursor: pointer">
                    </div>
                    <span id="nicknameError" class="errorMsg"></span>
                </div>
                <!--  성별 선택  -->
                <div class="inputGroup">
                    <label>성별 선택</label>
                    <div class="inputContainer">
                        <div id="userGender">
                            <input type="radio" id="male" name="userGender" class="radioLabel" value="1" th:checked="${#strings.equals(cDto.customerGender, '1')}">
                            <label for="male">남성</label>
                            <input type="radio" id="female" name="userGender" class="radioLabel" value="2" th:checked="${#strings.equals(cDto.customerGender, '2')}">
                            <label for="female">여성</label><br>
                            <span id="genderError" class="errorMsg"></span>
                        </div>
                    </div>
                </div>
                <!--  생년월일 입력  -->
                <div class="inputGroup">
                    <label>생년월일</label>
                    <div class="inputContainer birthContainer">
                        <input type="date" name="birthDay" id="customerBirthDay" class="inputForm" th:value="${#temporals.format(cDto.customerBDay, 'yyyy-MM-dd')}">
                    </div>
                    <span id="birthError" class="errorMsg"></span>
                </div>
                <!--  휴대전화 입력  -->
                <div class="inputGroup">
                    <label>휴대전화</label>
                    <div class="inputContainer phoneContainer">
                        <input type="text" class="inputForm" id="phone1" name="phone1" value="010" readonly>
                        <span>-</span>
                        <input type="text" class="inputForm" id="phone2" name="phone2" autocomplete="off" th:value="${#strings.substring(cDto.userPhone, 4, 8)}">
                        <span>-</span>
                        <input type="text" class="inputForm" id="phone3" name="phone3" autocomplete="off" th:value="${#strings.substring(cDto.userPhone, 9, 13)}">
                    </div>
                    <span id="phoneError" class="errorMsg"></span>
                </div>
                <!--  이메일 입력  -->
                <div class="inputGroup">
                    <label for="emailLocal">이메일</label>
                    <div class="inputContainer emailContainer">
                        <input type="text" class="inputForm" id="emailLocal" name="emailLocal" autocomplete="off" th:value="${#strings.substringBefore(cDto.userEmail, '@')}">
                        <span>@</span>
                        <div id="emailCustomDomainContainer" style="display: flex">
                            <input type="text" class="inputForm" id="emailDomain" name="emailDomain" placeholder="직접입력"
                                   autocomplete="off" th:value="${#strings.substringAfter(cDto.userEmail, '@')}">
                        </div>
                        <select id="selectDomain" name="selectDomain">
                            <!--            <option value="" selected disabled hidden>도메인</option>-->
                            <option value="gmail.com">gmail.com</option>
                            <option value="naver.com">naver.com</option>
                            <option value="kakao.com">kakao.com</option>
                            <option value="hanmail.net">hanmail.net</option>
                            <option value="nate.com">nate.com</option>
                            <option value="custom" selected>직접입력</option>
                        </select>
                    </div>
                    <span id="emailError" class="errorMsg"></span>
                </div>
                <!--  주소 입력  -->
                <!--  카카오 우편번호 api 활용  -->
                <div class="inputGroup">
                    <label for="searchPostBtn">주소</label>
                    <div class="inputContainer addressContainer">
                        <input type="text" class="inputForm" id="sample3_postcode" size="4" name="userPost"
                               placeholder="우편번호" th:value="${cDto.userPost}">
                        <input type="button" id="searchPostBtn" onclick="sample3_execDaumPostcode()" class="checkBtn"
                               value="우편번호 찾기">
                        <div class="inputContainer">
                            <input type="text" class="inputForm" id="sample3_address" size="20" placeholder="주소" th:value="${#strings.substringBefore(cDto.userAddress, '(')}">
                            <input type="text" class="inputForm" id="sample3_extraAddress" size="30" placeholder="참고항목" th:value="${#strings.prepend(#strings.substringAfter(cDto.userAddress, '('),'(')}">
                        </div>
                        <div class="inputContainer">
                            <input type="text" class="inputForm" id="sample3_detailAddress" name="userAddressDetail"
                                   placeholder="상세주소"
                                   autocomplete="off" th:value="${cDto.userAddressDetail}">
                        </div>
                        <div id="wrap"
                             style="display:none;border:1px solid;width:500px;height:300px;margin:5px 0;position:relative">
                            <img src="//t1.daumcdn.net/postcode/resource/images/close.png" id="btnFoldWrap"
                                 style="cursor:pointer;position:absolute;right:0px;top:-1px;z-index:1"
                                 onclick="foldDaumPostcode()"
                                 alt="접기 버튼">
                        </div>
                        <span id="addressError" class="errorMsg"></span>
                    </div>
                </div>
                <!--  submit 메시지 박스  -->
                <div id="messageBox" class="messageBox" role="alert"></div>

                <!--  가입하기 / 취소  -->
                <div class="signupFormBtn btnGroup">
                    <button type="submit" id="submitBtn" class="submitBtn">수정하기</button>
                    <button type="reset" class="resetBtn">취소</button>
                </div>
            </form>
        </main>
    </div>
</section>
<th:block th:replace="~{fragments :: footer}"></th:block>
<!-- 토스트 컨테이너  -->
<div id="toast" aria-live="polite" aria-atomic="true"></div>
</body>
<script src="/js/mypage.js"></script>
<script src="/js/customerUpdateFrm.js"></script>
<script th:inline="javascript">

</script>
</html>
