<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>판매자정보수정</title>
    <link rel="shortcut icon" href="/img/favicon/favicon-16x16.png" type="image/x-icon">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="/common/reset.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/sellerUpdateFrm.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <div th:replace="~{fragments/password-modal :: passwordCheckModalCss}"></div>
</head>
<body>
<th:block th:replace="~{fragments/fragments :: header}"></th:block>
<section class="mypage" data-role="consumer" data-user-uid="U123456">
    <!-- [상단 탭] : 프로필 / 주문내역 / 찜한 상품 -->
    <nav class="mypage-tabs" role="tablist" aria-label="마이페이지 탭">
        <!-- 프로필(프로필: fa-user) -->
        <button class="mypage-tab is-active" data-tab="profile" role="tab" aria-selected="true">
            <span class="i"><i class="fa-regular fa-user"></i></span>프로필
        </button>
        <!-- 주문내역(영수증: fa-receipt) -->
        <button class="mypage-tabs" data-tab="orders" role="tab" aria-selected="false">
            <span class="i"><i class="fa-solid fa-receipt"></i></span>주문내역
        </button>
        <!-- 찜한상품(하트: fa-heart) -->
        <button class="mypage-tabs" data-tab="wish" role="tab" aria-selected="false">
            <span class="i"><i class="fa-regular fa-heart"></i></span>찜한상품
        </button>
    </nav>

    <div class="mypage-grid">
            <div class="mypage-sidebar-container">
                <div class="mypage-sidebar">
                    <!--    판매자용 사이드바    -->
                    <div class="mypage-sidebar-seller sb-hidden">
                        <section class="sidebar-menu-section">
                            <p class="sidebar-menu-title">상품 관리</p>
                            <ul class="sidebar-menu-list">
                                <li><span class="i"><i class="fa-solid fa-boxes-stacked"></i>상품 관리</span></li>
                                <li><span class="i"><i class="fa-regular fa-square-plus"></i>상품 등록</span></li>
                            </ul>
                        </section>
                        <section class="sidebar-menu-section">
                            <p class="sidebar-menu-title">주문 관리</p>
                            <ul class="sidebar-menu-list">
                                <li><span class="i"><i class="fa-solid fa-clipboard-list"></i>주문 관리</span></li>
                                <li><span class="i"><i class="fa-solid fa-receipt"></i>주문내역 관리</span></li>
                            </ul>
                        </section>
                        <section class="sidebar-menu-section">
                            <p class="sidebar-menu-title">배송 관리</p>
                            <ul class="sidebar-menu-list">
                                <li><span class="i"><i class="fa-solid fa-truck"></i>배송 관리</span></li>
                                <li><span class="i"><i class="fa-solid fa-route"></i>내 배송현황 관리</span></li>
                            </ul>
                        </section>
                        <section class="sidebar-menu-section">
                            <p class="sidebar-menu-title">혜택 / 회원</p>
                            <ul class="sidebar-menu-list">
                                <li><span class="i"><i class="fa-solid fa-ticket"></i>쿠폰 관리</span></li>
                                <li><a th:href="@{/member/update/seller/{uid}(uid=${session.userUid})}"><i
                                        class="fa-regular fa-id-card"></i><span class="i">회원정보 수정</span></a></li>
                                <li><a th:href="@{/member/pwupdate/seller/{uid}(uid=${session.userUid})}"><i
                                        class="fa-solid fa-key"></i><span class="i">비밀번호 수정</span></a></li>
                                <li><span class="i"><i class="fa-solid fa-person-walking-arrow-right"></i>회원 탈퇴</span></li>
                            </ul>
                        </section>
                    </div>
                </div>
            </div>

        <!-- [R] 우측 컨텐츠 -->
        <main class="mypage-main">
            <form th:action="@{/member/sellerUpdate}" id="updateForm" class="updateForm" method="post">
                <!--  회원 uid (히든)  -->
                <input type="hidden" name="userUid" id="userUid" th:value="${sDto.userUid}">
                <!--  아이디 출력  -->
                <div class="inputGroup">
                    <label for="userId">아이디</label>
                    <div class="inputContainer">
                        <input type="text" class="inputForm" id="userId" name="userId" placeholder="아이디를 입력하세요"
                               autocomplete="off" th:value="${sDto.userId}" readonly>
                    </div>
                </div>
                <!--  사업자명 출력  -->
                <div class="inputGroup">
                    <label for="sellerName">사업자명</label>
                    <div class="inputContainer">
                        <input type="text" class="inputForm" id="sellerName" name="sellerName" placeholder="사업자명을 입력하세요."
                               autocomplete="off" th:value="${sDto.userName}" readonly>
                    </div>
                </div>
                <!--  사업자 번호 출력  -->
                <div class="inputGroup">
                    <label for="sellerNum">사업자등록번호</label>
                    <div class="inputContainer">
                        <input type="text" class="inputForm" id="sellerNum" name="sellerNum"
                               placeholder="사업자등록번호를 입력하세요."
                               autocomplete="off" th:value="${sDto.sellerNum}" readonly>
                    </div>
                </div>
                <!--  전화번호 출력  -->
                <div class="inputGroup">
                    <label>전화번호</label>
                    <div class="inputContainer telContainer">
                        <input type="text" class="inputForm" id="tel1" name="tel1" autocomplete="off"
                               th:value="${sDto.tel1}">
                        <span>-</span>
                        <input type="text" class="inputForm" id="tel2" name="tel2" autocomplete="off"
                               th:value="${sDto.tel2}">
                        <span>-</span>
                        <input type="text" class="inputForm" id="tel3" name="tel3" autocomplete="off"
                               th:value="${sDto.tel3}">
                    </div>
                    <span id="telError" class="errorMsg"></span>
                </div>
                <!--  이메일 입력  -->
                <div class="inputGroup">
                    <label for="emailLocal">이메일</label>
                    <div class="inputContainer emailContainer">
                        <input type="text" class="inputForm" id="emailLocal" name="emailLocal" autocomplete="off"
                               th:value="${#strings.substringBefore(sDto.userEmail, '@')}">
                        <span>@</span>
                        <div id="emailCustomDomainContainer" style="display: flex">
                            <input type="text" class="inputForm" id="emailDomain" name="emailDomain" placeholder="직접입력"
                                   autocomplete="off" th:value="${#strings.substringAfter(sDto.userEmail, '@')}">
                        </div>
                        <select id="selectDomain" name="selectDomain">
                            <!--            <option value="" selected disabled hidden>도메인</option>-->
                            <option value="gmail.com">gmail.com</option>
                            <option value="naver.com">naver.com</option>
                            <option value="kakao.com">kakao.com</option>
                            <option value="hanmail.net">hanmail.net</option>
                            <option value="nate.com">nate.com</option>
                            <option value="custom" selected>직접입력</option>
                        </select>
                    </div>
                    <span id="emailError" class="errorMsg"></span>
                </div>
                <!--  주소 입력  -->
                <!--  카카오 우편번호 api 활용  -->
                <div class="inputGroup">
                    <label for="searchPostBtn">주소</label>
                    <div class="inputContainer addressContainer">
                        <input type="text" class="inputForm" id="sample3_postcode" size="4" name="userPost"
                               placeholder="우편번호" th:value="${sDto.userPost}">
                        <input type="button" id="searchPostBtn" onclick="sample3_execDaumPostcode()" class="checkBtn"
                               value="우편번호 찾기">
                        <div class="inputContainer">
                            <input type="text" class="inputForm" id="sample3_address" size="20" placeholder="주소"
                                   th:value="${#strings.substringBefore(sDto.userAddress, '(')}">
                            <input type="text" class="inputForm" id="sample3_extraAddress" size="30" placeholder="참고항목"
                                   th:value="${#strings.prepend(#strings.substringAfter(sDto.userAddress, '('),'(')}">
                        </div>
                        <div class="inputContainer">
                            <input type="text" class="inputForm" id="sample3_detailAddress" name="userAddressDetail"
                                   placeholder="상세주소"
                                   autocomplete="off" th:value="${sDto.userAddressDetail}">
                        </div>
                        <div id="wrap"
                             style="display:none;border:1px solid;width:500px;height:300px;margin:5px 0;position:relative">
                            <img src="//t1.daumcdn.net/postcode/resource/images/close.png" id="btnFoldWrap"
                                 style="cursor:pointer;position:absolute;right:0px;top:-1px;z-index:1"
                                 onclick="foldDaumPostcode()"
                                 alt="접기 버튼">
                        </div>
                        <span id="addressError" class="errorMsg"></span>
                    </div>
                </div>
                <!--  계좌 출력  -->
                <div class="inputGroup">
                    <label>계좌번호</label>
                    <div class="inputContainer bankContainer">
                        <select id="sellerBank" name="sellerBank" th:value="${sDto.sellerBank}">
                            <option value="신한은행">신한은행</option>
                            <option value="KB국민은행">국민은행</option>
                            <option value="우리은행">우리은행</option>
                            <option value="하나은행">하나은행</option>
                            <option value="농협">농협</option>
                            <option value="기업은행">기업은행</option>
                            <option value="수협">수협</option>
                            <option value="산업은행">산업은행</option>
                            <option value="신협">신협</option>
                            <option value="우체국">우체국</option>
                            <option value="새마을금고">새마을금고</option>
                            <option value="iM뱅크">iM뱅크</option>
                            <option value="카카오뱅크">카카오뱅크</option>
                            <option value="케이뱅크">케이뱅크</option>
                            <option value="토스뱅크">토스뱅크</option>
                        </select>
                        <input type="text" name="sellerAccount" id="sellerAccount" class="inputForm"
                               placeholder="-(하이픈)포함해서 입력하세요." autocomplete="off"
                               th:value="${sDto.sellerAccount}">
                    </div>
                    <span id="bankError" class="errorMsg"></span>
                </div>
                <!--  배송 선택  -->
                <div class="inputGroup">
                    <label>배송방식 선택</label>
                    <div class="inputContainer deliveryContainer">
                            <select id="sellerDelivery" name="sellerDelivery" th:value="${sDto.sellerDelivery}">
                                <option value="CJ대한통운">CJ대한통운</option>
                                <option value="우체국택배">우체국택배</option>
                                <option value="한진택배">한진택배</option>
                                <option value="롯데택배">롯데택배</option>
                                <option value="로젠택배">로젠택배</option>
                                <option value="경동택배">경동택배</option>
                                <option value="자체배송">자체배송</option>
                            </select>
                        <span id="deliveryError" class="errorMsg"></span>
                    </div>
                </div>

                <!--  가입하기 / 취소  -->
                <div class="signupFormBtn btnGroup">
                    <button type="submit" id="submitBtn" class="submitBtn">수정하기</button>
                    <button type="reset" class="resetBtn">취소</button>
                </div>
            </form>
        </main>
    </div>
</section>
<th:block th:replace="~{fragments/fragments :: footer}"></th:block>
<!-- 토스트 컨테이너  -->
<div id="toast" aria-live="polite" aria-atomic="true"></div>
<div th:replace="~{fragments/password-modal :: passwordCheckModalHtml}"></div>
<script th:replace="~{fragments/password-modal :: passwordCheckModalJs}"></script>
</body>
<script src="/js/sellerUpdateFrm.js"></script>
<script th:inline="javascript">
    // DB에서 조회한 은행과 택배사 스크립트로 select 선택 지정
    $(document).ready(function() {
        // 서버에서 전달된 DTO 값을 JavaScript 변수에 저장
        const selectedBank = '[(${sDto.sellerBank})]';
        const selectedDelivery = '[(${sDto.sellerDelivery})]';

        console.log(selectedBank);
        console.log(selectedDelivery);
        // jQuery를 사용하여 해당 값과 일치하는 옵션 선택
        $('#sellerBank').val(selectedBank);
        $('#sellerDelivery').val(selectedDelivery);
    });
</script>
</html>
